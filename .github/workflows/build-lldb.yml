# SPDX-License-Identifier: MIT

# CI that builds this vscode extension and runs its integration tests against lldb-dap only.
# Linux-only by design.

name: build-lldb

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          npm install --loglevel verbose
          npm install @vscode/vsce typescript -g

      - name: Install LLDB and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y lldb gcc

      - name: Check lldb-dap version
        run: |
          # lldb-dap --version prints nothing, so report lldb's instead.
          lldb --version
          # Ubuntu ships lldb-dap-<version> rather than a plain lldb-dap.
          ls /usr/bin/lldb-dap*

      - name: Probe lldb-dap directly (no VS Code involved)
        # Isolates a hang in lldb-dap/the runner itself from a hang that's
        # specific to the VS Code extension host, before sinking three
        # minutes into the mocha timeouts that a hang in the real suite costs.
        run: node scripts/probe-lldb-dap.js lldb-dap 20000

      - name: compile
        run: npm run compile

      - name: test
        env:
          KDAP_TEST_DAP_LOG_DIR: ${{ runner.temp }}/dap-logs
        run: |
          mkdir -p "$KDAP_TEST_DAP_LOG_DIR"
          xvfb-run -a ./test.sh --lldb

      - name: Upload DAP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dap-logs
          path: ${{ runner.temp }}/dap-logs
          if-no-files-found: ignore

      - name: vsce package
        run: vsce package
