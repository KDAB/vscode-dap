# SPDX-License-Identifier: MIT

# CI that builds this vscode extension. Linux-only, GDB-only by design.

name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Not ubuntu-latest (24.04): its gdb is 15.1, which runs the inferior during the DAP
    # "launch" request instead of at "configurationDone", so breakpoints set before the
    # program starts are never hit. 26.04 ships gdb 17.1.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          npm install --loglevel verbose
          npm install @vscode/vsce typescript -g

      - name: Install GDB and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb gcc

      - name: Check GDB version
        run: gdb --version

      - name: compile
        run: npm run compile

      - name: test
        run: xvfb-run -a npm test

      - name: vsce package
        run: vsce package
