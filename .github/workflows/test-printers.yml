# SPDX-License-Identifier: MIT

# CI for the standalone test suites under printers/. Independent of the
# extension build: no node, just the debuggers, g++, cmake and Qt.

name: test-printers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's (or Qt version's) printers failing says nothing about
      # the others', and seeing every diff at once beats rerunning to find the
      # next one.
      fail-fast: false
      matrix:
        include:
          - name: linux-qt6.12
            runner: ubuntu-26.04
            # Every suite.
            suites: ""
            qt-tag: "v6.12.0-beta4"
          - name: linux-qt6.11
            runner: ubuntu-26.04
            suites: ""
            qt-tag: "v6.11.0"
          - name: macos-qt6.10
            runner: macos-15
            qt-version: 6.10.2
            # There is no usable gdb on macOS - unsigned, so it cannot debug
            # anything - so only the lldb printers are exercised here.
            suites: "--lldb"
            # No icu archive on macOS: Qt uses the system ICU there, and asking
            # aqtinstall for it fails rather than being merely redundant.
            qt-archives: qtbase

    steps:
      - uses: actions/checkout@v7

      - name: Install lldb, gdb, g++ and cmake
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lldb gdb g++ cmake

      # macOS needs no equivalent: lldb, clang and cmake all ship with the
      # runner image, lldb as part of Xcode.

      # Not the distro's qt6-base-dev: expected.txt is golden output, so Qt is pinned to an
      # exact version and changes when someone changes it, not when the distro updates.
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: KDABLabs/sanitized-qt-action@v1
        with:
          qt-tag: ${{ matrix.qt-tag }}
          qt-flavor: "debug"

      - name: Setup Python for the bindings
        if: runner.os == 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          archives: ${{ matrix.qt-archives }}
          cache: true

      - name: Versions and Python probes
        # Both suites are Python; if a debugger's scripting bindings are
        # missing this fails here with an obvious message instead of as a
        # confusing golden-output diff further down.
        run: |
          lldb --version
          cmake --version | head -1
          qmake -query QT_VERSION
          lldb --batch --no-lldbinit -o "script print('lldb python ok')"

      - name: GDB version and Python probe
        if: runner.os == 'Linux'
        run: |
          gdb --version | head -1
          gdb -q -nx -batch -ex "python print('gdb python ok')"

      - name: test
        run: ./test-printers.sh ${{ matrix.suites }}

      # The lldb QML frames suite needs LLDB 23+ for its frame providers, newer
      # than the distro's lldb, so it comes from apt.llvm.org. Only once the
      # suites above are done with the distro's: apt removes lldb, lldb-21 and
      # python3-lldb-21 to make room for it, the python3-lldb packages of two
      # versions being unable to coexist.
      - name: Install LLDB 23
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y lldb-23
          /usr/lib/llvm-23/bin/lldb --version

      - name: test QML frames (LLDB 23)
        if: runner.os == 'Linux'
        env:
          LLDB_DAP: /usr/lib/llvm-23/bin/lldb-dap
        run: ./printers/tests/qml_frames/test.sh lldb

      - name: Upload printer output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per matrix entry: the artifact names have to differ, and a diff is
          # only readable next to the platform and Qt it came from anyway.
          name: printer-output-${{ matrix.name }}
          path: |
            printers/**/tests/*output.txt
            printers/**/tests/*/output.txt
            printers/tests/*/output-*.txt
          if-no-files-found: ignore
